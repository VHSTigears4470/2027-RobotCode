// Shared build logic applied by the root robot project and every libs/* module.
// Version numbers themselves live in gradle/libs.versions.toml (the single source
// of truth); this file just wires them up identically everywhere so all modules
// compile against the same toolchain, flags, and test framework.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}

// GradleRIO only scans <projectDir>/vendordeps, so the shared root vendordeps/
// folder is invisible to every libs/* module and they would otherwise compile
// against WPILib alone. Load the root folder into each subproject explicitly
// (the root project already loaded it during plugin application), then re-run
// validation so all modules see the exact same vendor stack.
if (project != rootProject) {
    wpi.vendor.loadFrom(rootProject.file('vendordeps'))
    wpi.vendor.validateDependencies()
}

// AdvantageKit's @AutoLog processor (akit-autolog) is not part of the vendordep
// JSON's javaDependencies, so wire it up for every module whose sources use
// @AutoLog, keeping the version in sync with vendordeps/AdvantageKit.json.
def akitJsonFile = rootProject.file('vendordeps/AdvantageKit.json')
if (akitJsonFile.exists()) {
    def akitVersion = new groovy.json.JsonSlurper().parseText(akitJsonFile.text).version
    dependencies.add('annotationProcessor', "org.littletonrobotics.akit:akit-autolog:${akitVersion}")
}

// Keep string concat inlining consistent with the original robot project.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-XDstringConcat=inline')
    options.release = libs.versions.java.get().toInteger()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}